<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yahtzee scorecard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9edf5; --card:#ffffff; --ink:#172130; --muted:#66768a; --line:#e1e7f0;
  --head:#17243a; --head-ink:#ffffff; --sec:#f1f4f9; --gold:#f0b429; --red:#d63c2f;
  --shadow:0 8px 28px rgba(23,36,58,.12);
  --diebg:#ffffff; --dieline:#b9c4d3; --diepip:#172130;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d131c; --card:#17212e; --ink:#eaf0f7; --muted:#8fa1b5; --line:#263446;
    --head:#0a0f16; --sec:#1c2836; --shadow:0 8px 28px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#0d131c; --card:#17212e; --ink:#eaf0f7; --muted:#8fa1b5; --line:#263446;
  --head:#0a0f16; --sec:#1c2836; --shadow:0 8px 28px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Fredoka",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
button{font:inherit}
.wrap{max-width:620px;margin:0 auto;padding:14px 10px 110px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:2px 4px 12px}
.logo{display:block;flex:none}
.top h1{font-size:26px;font-weight:700;margin:0;flex:1;letter-spacing:.2px}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{border-color:var(--muted)}
.undo{display:flex;align-items:center;gap:8px;padding:6px 14px;flex:none}
.undo:disabled{opacity:.4;cursor:default}
.undo:not(:disabled):hover{border-color:var(--ink)}
.undo .ul{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1;text-align:left;font-weight:600}
.undo small{display:none;font-size:12px;color:var(--muted);font-weight:400;max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.wide .undo{order:2}
.wide .undo small{display:block}
.status{order:9;flex:0 0 100%;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:15px;min-height:22px}
.status b{color:var(--ink);font-weight:600}
.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.track,.tools{display:none}
.track{align-items:center;gap:12px}
.track .rt{font-size:15px;color:var(--muted);white-space:nowrap}
.track .rt b{color:var(--ink);font-weight:600}
.track .seg{display:flex;gap:4px;align-items:center}
.track .seg i{width:14px;height:10px;border-radius:4px;background:color-mix(in srgb,var(--muted) 28%,transparent);transition:width .2s,background .2s}
.track .seg i.done{background:var(--ink);opacity:.75}
.track .seg i.cur{background:var(--pc);width:26px}

/* winner banner */
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--pc);color:#fff;border-radius:18px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.banner .big{font-size:20px;font-weight:700;line-height:1.2}
.banner .sm{font-size:14px;opacity:.9}
.banner .btn{background:#fff;color:#172130;border-color:#fff;flex:none}

/* shared card + cells */
.card{background:var(--card);border-radius:20px;border:1px solid var(--line);box-shadow:var(--shadow);overflow:clip}
table{border-collapse:collapse;width:100%;table-layout:fixed}
th,td{padding:0;text-align:center}
.die{display:block;flex:none}
.vchip{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--sec);font-weight:600;font-size:12.5px;flex:none;border:1px solid var(--line)}
.cell{display:block;width:100%;height:46px;border-radius:12px;font-size:20px;font-weight:600;cursor:pointer;transition:transform .08s,background .15s,border-color .15s,box-shadow .15s;
  border:1.5px solid color-mix(in srgb,var(--muted) 32%,transparent);background:color-mix(in srgb,var(--muted) 7%,transparent);color:color-mix(in srgb,var(--muted) 75%,var(--ink))}
.cell.empty:hover{border-color:var(--pc,var(--muted));color:var(--pc,var(--ink));background:color-mix(in srgb,var(--pc,var(--muted)) 10%,transparent)}
.cell:active{transform:scale(.95)}
.cell:focus-visible,.btn:focus-visible,.tile:focus-visible,.key:focus-visible,.iconbtn:focus-visible,.stepbtn:focus-visible{outline:3px solid var(--pc,var(--ink));outline-offset:2px}
.cell.filled{border:1.5px solid transparent;background:color-mix(in srgb,var(--pc) 16%,var(--card));color:var(--ink)}
.cell.zero{background:color-mix(in srgb,var(--muted) 14%,var(--card));color:var(--muted);border-color:transparent}
.meter{height:6px;border-radius:99px;background:color-mix(in srgb,var(--muted) 22%,transparent);margin:0 8px 3px;overflow:hidden}
.meter i{display:block;height:100%;width:var(--w);background:var(--pc);border-radius:99px}
.mtxt{font-size:12px;color:var(--muted)}
.gotit{display:inline-block;background:var(--pc);color:#fff;font-weight:600;border-radius:99px;padding:3px 10px;font-size:14px}
.pname{width:100%;font:inherit;font-weight:600;color:inherit;background:transparent;border:0;border-radius:8px;padding:3px 2px;text-overflow:ellipsis}
.star{color:var(--gold);font-size:16px;margin-left:3px;vertical-align:4px}

/* ---------- narrow / vertical table (.v) ---------- */
col.lc{width:34%}
.v tbody td{border-bottom:1px solid var(--line)}
.v thead th{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--head);color:var(--head-ink);padding:8px 4px;border-bottom:4px solid var(--pc,transparent)}
.v thead th.pl{cursor:pointer;transition:background .15s}
.v thead th.pl.act{background:var(--pc)}
.v th.corner{text-align:left;padding-left:14px;border-bottom-color:transparent}
.v .corner .rd{font-size:12px;opacity:.75;line-height:1}
.v .corner .rn{font-size:26px;font-weight:700;line-height:1.1}
.v .corner .rn span{font-size:14px;font-weight:500;opacity:.7}
.v .pname{text-align:center;font-size:15px}
.v .pname:hover{background:rgba(255,255,255,.12)}
.v .pname:focus-visible{outline:2px solid #fff;outline-offset:0;background:rgba(255,255,255,.14)}
.v .ptot{font-size:28px;font-weight:700;line-height:1.1}
.v thead th.act .star{color:#fff}
.v.n4 .pname,.v.n5 .pname,.v.n6 .pname,.v.n7 .pname,.v.n8 .pname{font-size:12.5px}
.v.n4 .ptot,.v.n5 .ptot,.v.n6 .ptot,.v.n7 .ptot,.v.n8 .ptot{font-size:22px}
.v.n3 .ptot{font-size:24px}
.v.n5 .pname,.v.n6 .pname,.v.n7 .pname,.v.n8 .pname{font-size:10.5px}
.v.n5 .ptot,.v.n6 .ptot,.v.n7 .ptot,.v.n8 .ptot{font-size:17px}
.v td.label{text-align:left;padding:8px 6px 8px 12px}
.lab{display:flex;align-items:center;gap:9px}
.lt b{font-weight:500;font-size:15px;display:block;line-height:1.15}
.lt small{display:block;font-size:12px;color:var(--muted);line-height:1.2;margin-top:1px}
.v tr.sec td{background:var(--sec);text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}
.v tr.sec .sh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.v tr.sec b{font-weight:600}
.v tr.sec span{color:var(--muted);font-size:13px}
.v td.c{padding:5px 4px}
.v td.act{background:color-mix(in srgb,var(--pc) 6%,transparent)}
.v td.act .cell.empty{border:2px solid var(--pc);color:var(--pc);background:color-mix(in srgb,var(--pc) 12%,var(--card));box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 16%,transparent)}
.v td.act .cell.empty:hover{background:color-mix(in srgb,var(--pc) 22%,var(--card))}
.v.n4 .cell{font-size:18px;height:44px}
.v.n5 .cell,.v.n6 .cell,.v.n7 .cell,.v.n8 .cell{font-size:15px;height:40px}
.v td.bonus{padding:6px 2px}
.v tr.tot td{background:var(--head);color:var(--head-ink);border-bottom:0;padding:12px 4px;font-size:24px;font-weight:700}
.v tr.tot td.label{font-size:15px;font-weight:600}
.v tr.tot td.c{border-top:4px solid var(--pc)}
.v.n4 tr.tot td.c{font-size:19px}
.v.n5 tr.tot td.c,.v.n6 tr.tot td.c,.v.n7 tr.tot td.c,.v.n8 tr.tot td.c{font-size:16px}
@media (max-width:480px){
  .v.n3 td.label small,.v.n4 td.label small,.v.n5 td.label small,.v.n6 td.label small,.v.n7 td.label small,.v.n8 td.label small{display:none}
  .v.n4 .vchip,.v.n4 .die,.v.n5 .vchip,.v.n5 .die,.v.n6 .vchip,.v.n6 .die,.v.n7 .vchip,.v.n7 .die,.v.n8 .vchip,.v.n8 .die{display:none}
  .v.n3 .vchip,.v.n3 .die{width:24px;height:24px}
  .v td.label{padding-left:10px}
  .lab{gap:7px}
}

/* ---------- widescreen / horizontal table (.w) ---------- */
.w tr.groups th{padding:10px 14px;text-align:left;font-weight:600;font-size:15px;background:var(--sec);border-bottom:1px solid var(--line)}
.w tr.groups th span{color:var(--muted);font-weight:400;margin-left:10px;font-size:13px}
.w tr.cols th{padding:14px 4px 10px;background:var(--card);border-bottom:2px solid var(--line);vertical-align:bottom;font-weight:500}
.w tr.cols th.cor{text-align:left;padding-left:22px;color:var(--muted);font-size:14px}
.w .ch{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:default}
.w .ch b{font-weight:500;font-size:13px;line-height:1.15;padding:0 2px}
.w .vchip{width:30px;height:30px}
.w th.gl,.w td.gl{border-left:2px solid var(--line)}
.w th.tt,.w td.tt{background:var(--head);color:var(--head-ink);border-left-color:transparent}
.w tr.cols th.tt{font-size:14px;font-weight:600;vertical-align:bottom;padding-bottom:12px}
.w tbody td,.w tbody th{border-bottom:1px solid var(--line)}
.w tbody tr:last-child td,.w tbody tr:last-child th{border-bottom:0}
.w th.pcell{text-align:left;padding:10px 12px 10px 14px;border-left:8px solid var(--pc);cursor:pointer;background:var(--card);transition:background .15s}
.w tr.act th.pcell{background:var(--pc);color:#fff}
.w .pname{text-align:left;font-size:19px;padding:3px 6px;margin-left:-6px;width:calc(100% + 6px)}
.w .pname:hover{background:color-mix(in srgb,currentColor 10%,transparent)}
.w .pname:focus-visible{outline:2px solid currentColor;outline-offset:0}
.w .psub{font-size:13px;color:var(--muted);margin-top:1px}
.w tr.act .psub{color:rgba(255,255,255,.88)}
.w td.c{padding:7px 4px}
.w tr.act td.c{background:color-mix(in srgb,var(--pc) 7%,transparent)}
.w tr.act .cell.empty{border:2px solid var(--pc);color:var(--pc);background:color-mix(in srgb,var(--pc) 12%,var(--card));box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 16%,transparent)}
.w tr.act .cell.empty:hover{background:color-mix(in srgb,var(--pc) 22%,var(--card))}
.w .cell{height:60px;font-size:23px;border-radius:14px}
.w.n1 .cell,.w.n2 .cell{height:70px}
.w td.tt{font-size:36px;font-weight:700;border-bottom-color:rgba(255,255,255,.1)}
.w tr.act td.tt{background:var(--pc)}
.w td.tt .star{font-size:18px}
.w tr.act td.tt .star{color:#fff}
col.pcc{width:190px}
col.tcc{width:110px}

/* wide chrome */
.wide .wrap{max-width:1420px;padding:16px 28px 60px}
.wide .top{flex-wrap:nowrap;gap:22px;margin:4px 2px 18px}
.wide .top h1{flex:none;font-size:30px}
.wide .status{order:0;flex:1 1 auto;min-width:0;font-size:17px;margin:0}
.wide .track{display:flex;order:1}
.wide .tools{display:flex;align-items:center;gap:12px;order:2}
.wide .iconbtn{order:3}
.wide .foot{display:none}
.wide .banner{padding:16px 22px}

/* footer (narrow) */
.foot{display:flex;gap:10px;justify-content:space-between;align-items:center;margin:16px 4px 0;flex-wrap:wrap}
.grp{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:15px}
.stepbtn{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:22px;cursor:pointer;line-height:1}
.stepbtn:disabled{opacity:.35;cursor:default}
.grp .num{color:var(--ink);font-weight:600;min-width:1ch;text-align:center}
.btn{font-weight:500;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 16px;min-height:44px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--pc,var(--ink));border-color:var(--pc,var(--ink));color:#fff}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 50%,var(--line))}
.btn.wide{width:100%}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--head);color:#fff;border-radius:16px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:40;max-width:calc(100% - 20px);font-size:15px;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(6,10,16,.55);display:none;align-items:flex-end;justify-content:center;z-index:30}
.veil.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.3);max-height:100%;overflow:auto}
@media (min-width:700px){
  .veil{align-items:center;padding:20px}
  .sheet{border-radius:24px;max-width:440px;padding-bottom:18px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
}
.sh-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sh-ico{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:var(--sec);border:1px solid var(--line);font-weight:700;font-size:16px}
.sh-t{flex:1;min-width:0}
.sh-t h2{margin:0;font-size:21px;line-height:1.15}
.sh-t p{margin:3px 0 0;color:var(--muted);font-size:14px;display:flex;align-items:center;gap:7px}
.x{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:var(--sec);color:var(--ink);font-size:22px;cursor:pointer;line-height:1}
.ask{margin:0 0 10px;font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tiles.two{grid-template-columns:1fr 1fr}
.tile{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:14px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tile b{font-size:28px;font-weight:700;line-height:1}
.tile small{font-size:13px;color:var(--muted)}
.tile:hover{border-color:var(--pc)}
.tile:active{transform:scale(.97)}
.tile.sel,.tile.main{background:var(--pc);border-color:var(--pc);color:#fff}
.tile.sel small,.tile.main small{color:rgba(255,255,255,.88)}
.tiles.two .tile{padding:22px 6px}
.tiles.two b{font-size:34px}
.disp{font-size:46px;font-weight:700;text-align:center;border-radius:16px;background:var(--sec);margin-bottom:10px;min-height:72px;display:flex;align-items:center;justify-content:center}
.disp.ph{color:var(--muted);font-size:17px;font-weight:500}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{font-size:24px;font-weight:600;height:54px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.key:active{transform:scale(.96)}
.key.ok{background:var(--pc);border-color:var(--pc);color:#fff}
.key.aux{background:var(--sec);font-size:20px}
.row{display:flex;gap:8px;margin-top:10px}
.row .btn{flex:1}
.stepper{display:flex;align-items:center;justify-content:center;gap:22px;margin:4px 0 16px}
.stepper .stepbtn{width:60px;height:60px;font-size:30px;border-radius:18px}
.stepper .big{font-size:40px;font-weight:700;min-width:2ch;text-align:center}
.note{color:var(--muted);margin:0 0 14px;line-height:1.4}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .2s ease-out}
  @keyframes up{from{transform:translateY(28px);opacity:.5}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <svg class="logo" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><rect x="1.5" y="1.5" width="21" height="21" rx="5.5" fill="var(--red)"/><g fill="#fff"><circle cx="7" cy="7" r="2"/><circle cx="17" cy="7" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></g></svg>
    <h1>Yahtzee</h1>
    <div class="status" id="status"></div>
    <div class="track" id="track" aria-label="Round progress"></div>
    <div class="tools">
      <div class="grp">
        <span>Players</span>
        <button class="stepbtn js-minus" aria-label="Remove a player">−</button>
        <span class="num pcount">2</span>
        <button class="stepbtn js-plus" aria-label="Add a player">+</button>
      </div>
      <button class="btn danger js-reset">New game</button>
    </div>
    <button class="btn undo" id="undo" disabled aria-label="Undo last input">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      <span class="ul"><span>Undo</span><small id="undoSub">Nothing to undo</small></span>
    </button>
    <button class="iconbtn" id="theme" aria-label="Switch light or dark theme">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>
    </button>
  </header>
  <div id="banner"></div>
  <div class="card"><table id="tbl"></table></div>
  <div class="foot">
    <div class="grp">
      <span>Players</span>
      <button class="stepbtn js-minus" aria-label="Remove a player">−</button>
      <span class="num pcount">2</span>
      <button class="stepbtn js-plus" aria-label="Add a player">+</button>
    </div>
    <button class="btn danger js-reset">New game</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="veil" id="veil"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
const COLORS=["#d63c2f","#2f6fdb","#1f8f5f","#8a4fd1","#e08c2b","#0ea5a5","#d1368a","#8a6d1f"];
const DEFNAMES=["Player 1","Player 2","Player 3","Player 4","Player 5","Player 6","Player 7","Player 8"];
const UPPER=[["ones","Ones",1],["twos","Twos",2],["threes","Threes",3],["fours","Fours",4],["fives","Fives",5],["sixes","Sixes",6]];
const LOWER=[
 {k:"three",n:"3 of a kind",h:"Three the same · add all dice",t:"sum",chip:"Σ"},
 {k:"four",n:"4 of a kind",h:"Four the same · add all dice",t:"sum",chip:"Σ"},
 {k:"full",n:"Full house",h:"Three of one, two of another",t:"fixed",v:25},
 {k:"small",n:"Small straight",h:"Four dice in a row",t:"fixed",v:30},
 {k:"large",n:"Large straight",h:"Five dice in a row",t:"fixed",v:40},
 {k:"yahtzee",n:"Yahtzee",h:"Five of a kind",t:"fixed",v:50},
 {k:"chance",n:"Chance",h:"Anything · add all dice",t:"sum",chip:"Σ"},
];
const ALLKEYS=[...UPPER.map(u=>u[0]),...LOWER.map(l=>l.k)];
const $=id=>document.getElementById(id);
const $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const catName=k=>{if(k==="bonus")return"Yahtzee bonus";const u=UPPER.find(x=>x[0]===k);if(u)return u[1];const l=LOWER.find(x=>x.k===k);return l?l.n:k};
const mq=window.matchMedia("(min-width:1040px)");

/* state */
function fresh(n,names){return {turn:0,hist:[],players:Array.from({length:n},(_,i)=>({name:(names&&names[i])||DEFNAMES[i],s:{},b:0}))}}
let S=fresh(2);
try{
  const r=localStorage.getItem("yahtzee-v2");
  if(r){const p=JSON.parse(r);
    if(p&&Array.isArray(p.players)&&p.players.length>=1&&p.players.length<=8){S=p; if(typeof S.turn!=="number"||S.turn>=S.players.length)S.turn=0;}}
}catch(e){}
S.hist=Array.isArray(S.hist)?S.hist.filter(e=>e&&typeof e.k==="string"&&e.i<S.players.length):[];
function save(){try{localStorage.setItem("yahtzee-v2",JSON.stringify(S))}catch(e){}}

const has=(p,k)=>p.s[k]!==undefined;
const upperSub=p=>UPPER.reduce((a,u)=>a+(p.s[u[0]]||0),0);
const lowerSub=p=>LOWER.reduce((a,l)=>a+(p.s[l.k]||0),0);
const total=p=>upperSub(p)+(upperSub(p)>=63?35:0)+lowerSub(p)+p.b*100;
const filledCount=p=>ALLKEYS.filter(k=>has(p,k)).length;
const isFull=p=>filledCount(p)===13;
function nextTurn(from){const n=S.players.length;for(let d=1;d<=n;d++){const j=(from+d)%n;if(!isFull(S.players[j]))return j}return from}

/* dice icons */
const PIPS={1:[[12,12]],2:[[7,7],[17,17]],3:[[7,7],[12,12],[17,17]],4:[[7,7],[17,7],[7,17],[17,17]],5:[[7,7],[17,7],[12,12],[7,17],[17,17]],6:[[7,6.5],[17,6.5],[7,12],[17,12],[7,17.5],[17,17.5]]};
function die(n,size){size=size||28;
  return `<svg class="die" width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true"><rect x="1.5" y="1.5" width="21" height="21" rx="5.5" fill="var(--diebg)" stroke="var(--dieline)" stroke-width="1.5"/>${PIPS[n].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="${n===1?2.6:2}" fill="${n===1?"var(--red)":"var(--diepip)"}"/>`).join("")}</svg>`}

/* shared cell pieces */
function cellBtn(i,k){
  const p=S.players[i],v=p.s[k],cls=v===undefined?"empty":(v===0?"filled zero":"filled");
  return `<button class="cell ${cls}" data-i="${i}" data-k="${k}" aria-label="${esc(p.name)}, ${catName(k)}, ${v===undefined?"not scored":v}">${v===undefined?"+":v}</button>`;
}
function bonusBtn(i){
  const p=S.players[i];
  return `<button class="cell ${p.b?"filled":"empty"}" data-i="${i}" data-k="bonus" aria-label="${esc(p.name)}, Yahtzee bonus">${p.b?"+"+p.b*100:"+"}</button>`;
}
function upperBonusInner(p){
  const u=upperSub(p);
  return u>=63?`<span class="gotit">+35</span>`:`<div class="meter" style="--w:${Math.min(100,u/63*100)}%"><i></i></div><span class="mtxt">${u} / 63</span>`;
}
const starHTML='<span class="star" title="Leading" aria-label="leading">★</span>';

/* ---------- narrow layout ---------- */
function narrowHTML(P,n,T,max,over){
  const round=Math.min(13,filledCount(P[S.turn])+1);
  const c=(i,k)=>`<td class="c ${S.turn===i?"act":""}" style="--pc:${COLORS[i]}">${cellBtn(i,k)}</td>`;
  let h=`<colgroup><col class="lc">${P.map(()=>"<col>").join("")}</colgroup>`;
  h+=`<thead><tr><th class="corner" scope="col"><div class="rd">${over?"Finished":"Round"}</div><div class="rn">${over?"13":round}<span>/13</span></div></th>`;
  P.forEach((p,i)=>{
    const lead=n>1&&T[i]===max&&max>0;
    h+=`<th class="pl ${S.turn===i&&!over?"act":""}" data-i="${i}" scope="col" style="--pc:${COLORS[i]}"><input class="pname" value="${esc(p.name)}" data-i="${i}" maxlength="14" aria-label="Player ${i+1} name" enterkeyhint="done"><div class="ptot">${T[i]}${lead?starHTML:""}</div></th>`;
  });
  h+="</tr></thead><tbody>";
  h+=`<tr class="sec"><td colspan="${n+1}"><div class="sh"><b>Upper section</b><span>Total 63+ to earn 35 bonus</span></div></td></tr>`;
  UPPER.forEach(([k,name,f])=>{
    h+=`<tr><td class="label"><div class="lab">${die(f)}<div class="lt"><b>${name}</b><small>Add up the ${f}s</small></div></div></td>${P.map((_,i)=>c(i,k)).join("")}</tr>`;
  });
  h+=`<tr><td class="label"><div class="lab"><span class="vchip">35</span><div class="lt"><b>Bonus</b><small>Automatic at 63+</small></div></div></td>`+
    P.map((p,i)=>`<td class="c bonus ${S.turn===i?"act":""}" style="--pc:${COLORS[i]}">${upperBonusInner(p)}</td>`).join("")+"</tr>";
  h+=`<tr class="sec"><td colspan="${n+1}"><div class="sh"><b>Lower section</b><span>Scratch a box if you can't score it</span></div></td></tr>`;
  LOWER.forEach(l=>{
    h+=`<tr><td class="label"><div class="lab"><span class="vchip">${l.t==="fixed"?l.v:l.chip}</span><div class="lt"><b>${l.n}</b><small>${l.h}</small></div></div></td>${P.map((_,i)=>c(i,l.k)).join("")}</tr>`;
  });
  h+=`<tr><td class="label"><div class="lab"><span class="vchip">100</span><div class="lt"><b>Yahtzee bonus</b><small>Each extra Yahtzee</small></div></div></td>`+
    P.map((p,i)=>`<td class="c ${S.turn===i?"act":""}" style="--pc:${COLORS[i]}">${bonusBtn(i)}</td>`).join("")+"</tr>";
  h+=`<tr class="tot"><td class="label">Total</td>${P.map((p,i)=>`<td class="c" style="--pc:${COLORS[i]}">${T[i]}</td>`).join("")}</tr></tbody>`;
  return h;
}

/* ---------- wide layout: players are rows, categories run across ---------- */
function wideHTML(P,n,T,max,over){
  let h=`<colgroup><col class="pcc">${"<col>".repeat(15)}<col class="tcc"></colgroup>`;
  h+=`<thead><tr class="groups"><th></th><th colspan="7" class="gl">Upper section<span>Total 63+ earns a 35 bonus</span></th><th colspan="8" class="gl">Lower section<span>Scratch a box you can't score</span></th><th class="gl" style="background:var(--head)"></th></tr>`;
  h+=`<tr class="cols"><th class="cor" scope="col">Player</th>`;
  UPPER.forEach(([k,name,f],idx)=>{h+=`<th scope="col"${idx===0?' class="gl"':""} title="Add up the ${f}s"><div class="ch">${die(f,32)}<b>${name}</b></div></th>`});
  h+=`<th scope="col" title="Automatic at 63+"><div class="ch"><span class="vchip">35</span><b>Bonus</b></div></th>`;
  LOWER.forEach((l,idx)=>{h+=`<th scope="col"${idx===0?' class="gl"':""} title="${esc(l.h)}"><div class="ch"><span class="vchip">${l.t==="fixed"?l.v:l.chip}</span><b>${l.n}</b></div></th>`});
  h+=`<th scope="col" title="Each extra Yahtzee"><div class="ch"><span class="vchip">100</span><b>Yahtzee bonus</b></div></th><th class="tt gl" scope="col">Total</th></tr></thead><tbody>`;
  P.forEach((p,i)=>{
    const act=S.turn===i&&!over,lead=n>1&&T[i]===max&&max>0;
    h+=`<tr class="prow ${act?"act":""}" style="--pc:${COLORS[i]}">`;
    h+=`<th class="pcell" scope="row" data-i="${i}"><input class="pname" value="${esc(p.name)}" data-i="${i}" maxlength="14" aria-label="Player ${i+1} name" enterkeyhint="done"><div class="psub">${over?"Finished":act?"Rolling now":filledCount(p)+" of 13 scored"}</div></th>`;
    UPPER.forEach(([k],idx)=>{h+=`<td class="c${idx===0?" gl":""}">${cellBtn(i,k)}</td>`});
    h+=`<td class="c bonus">${upperBonusInner(p)}</td>`;
    LOWER.forEach((l,idx)=>{h+=`<td class="c${idx===0?" gl":""}">${cellBtn(i,l.k)}</td>`});
    h+=`<td class="c">${bonusBtn(i)}</td>`;
    h+=`<td class="tt gl">${T[i]}${lead?starHTML:""}</td></tr>`;
  });
  h+="</tbody>";
  return h;
}

/* render */
function render(){
  const wide=mq.matches;
  document.body.classList.toggle("wide",wide);
  const P=S.players,n=P.length,T=P.map(total),max=Math.max(...T);
  const over=P.every(isFull);
  const anyScore=P.some(p=>Object.keys(p.s).length>0);
  const cur=P[S.turn];
  const fc=P.map(filledCount),minF=Math.min(...fc);

  $("status").innerHTML= over
    ? `<b>Game over</b> · final scores below`
    : `<span class="dot" style="background:${COLORS[S.turn]}"></span>` +
      (anyScore ? `<span><b>${esc(cur.name)}</b>'s turn · tap a box to score it</span>`
                : `<span>Roll the dice, then tap a <b>+</b> in <b>${esc(cur.name)}</b>'s ${wide?"row":"column"}</span>`);

  const tr=$("track");
  tr.style.setProperty("--pc",COLORS[S.turn]);
  tr.innerHTML=`<span class="rt">${over?"<b>Finished</b>":`Round <b>${Math.min(13,fc[S.turn]+1)}</b> / 13`}</span><span class="seg">`+
    Array.from({length:13},(_,r)=>`<i class="${r<minF?"done":(!over&&r===fc[S.turn]?"cur":"")}"></i>`).join("")+`</span>`;

  if(over){
    const wi=T.map((t,i)=>t===max?i:-1).filter(i=>i>=0);
    const names=wi.map(i=>esc(P[i].name)).join(" & ");
    $("banner").innerHTML=`<div class="banner" style="--pc:${COLORS[wi[0]]}"><div><div class="big">${wi.length>1?names+" tie":names+" wins"}</div><div class="sm">${max} points</div></div><button class="btn" data-act="again">Play again</button></div>`;
  } else $("banner").innerHTML="";

  const t=$("tbl");
  if(wide){t.className="w n"+n;t.innerHTML=wideHTML(P,n,T,max,over)}
  else{t.className="v n"+n;t.innerHTML=narrowHTML(P,n,T,max,over)}

  const last=S.hist[S.hist.length-1],ub=$("undo");
  ub.disabled=!last;
  $("undoSub").textContent=last?describe(last):"Nothing to undo";
  ub.title=last?"Undo: "+describe(last):"Nothing to undo yet";
  $$(".pcount").forEach(e=>e.textContent=n);
  $$(".js-minus").forEach(b=>b.disabled=n<=1);
  $$(".js-plus").forEach(b=>b.disabled=n>=8);
}
if(mq.addEventListener)mq.addEventListener("change",render);else if(mq.addListener)mq.addListener(render);

/* table events */
$("tbl").addEventListener("click",e=>{
  const c=e.target.closest(".cell"); if(c){openScore(+c.dataset.i,c.dataset.k);return}
  if(e.target.closest("input")) return;
  const th=e.target.closest("th[data-i]"); if(th){S.turn=+th.dataset.i;save();render()}
});
$("tbl").addEventListener("input",e=>{
  if(e.target.classList.contains("pname")){S.players[+e.target.dataset.i].name=e.target.value.trim()||DEFNAMES[+e.target.dataset.i];save()}
});
$("tbl").addEventListener("change",e=>{if(e.target.classList.contains("pname"))render()});
$("tbl").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.classList.contains("pname"))e.target.blur()});
$("banner").addEventListener("click",e=>{if(e.target.closest("[data-act=again]"))newGame()});

/* scoring + undo history */
const getV=(p,k)=>k==="bonus"?p.b:p.s[k];
function setV(p,k,v){
  if(k==="bonus")p.b=v||0;
  else if(v===undefined||v===null)delete p.s[k];
  else p.s[k]=v;
}
function describe(e){
  const p=S.players[e.i],nm=p?p.name:"Player";
  const val=e.k==="bonus"?"+"+(e.v*100):(e.v===null?"cleared":e.v===0?"scratched":String(e.v));
  return nm+" · "+catName(e.k)+": "+val;
}
function commit(i,k,v){
  const p=S.players[i],prev=getV(p,k);
  const nv=v===null?(k==="bonus"?0:undefined):v;
  if(nv===prev){closeSheet();return}
  const isNew=k!=="bonus"&&prev===undefined&&v!==null;
  const entry={i,k,prev:prev===undefined?null:prev,v,prevTurn:S.turn};
  S.hist.push(entry);if(S.hist.length>200)S.hist.shift();
  setV(p,k,nv);
  if(isNew)S.turn=nextTurn(i);
  save();closeSheet();render();
  let msg=describe(entry);
  if(isNew&&!S.players.every(isFull))msg+=" → "+S.players[S.turn].name+"'s turn";
  toast(msg,true);
}
function undoLast(){
  const e=S.hist.pop();if(!e)return;
  const p=S.players[e.i];
  if(p)setV(p,e.k,e.prev===null?undefined:e.prev);
  S.turn=Math.max(0,Math.min(e.prevTurn,S.players.length-1));
  save();render();
  toast("Undid "+describe(e),false);
}
let tt=null;
function toast(msg,withUndo){
  const t=$("toast");
  t.innerHTML="<span></span>"+(withUndo?'<button data-act="undo">Undo</button>':"");
  t.firstChild.textContent=msg;
  t.classList.add("show");clearTimeout(tt);tt=setTimeout(hideToast,6000);
}
function hideToast(){$("toast").classList.remove("show")}
$("toast").addEventListener("click",e=>{if(e.target.closest("[data-act=undo]"))undoLast()});
$("undo").addEventListener("click",undoLast);
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key.toLowerCase()==="z"&&!veil.classList.contains("open")&&!(e.target.closest&&e.target.closest("input"))){
    e.preventDefault();undoLast();
  }
});

/* sheet */
const veil=$("veil"),sheet=$("sheet");
let ctx=null,kp=null,lastFocus=null;
function closeSheet(){veil.classList.remove("open");sheet.innerHTML="";ctx=null;kp=null;if(lastFocus&&document.contains(lastFocus)){try{lastFocus.focus()}catch(e){}}}
function showSheet(html,pc){
  lastFocus=document.activeElement;
  sheet.style.setProperty("--pc",pc||"var(--ink)");
  sheet.innerHTML=html;veil.classList.add("open");
  const f=sheet.querySelector(".tile,.key,.btn,.stepbtn");if(f)f.focus({preventScroll:true});
}
veil.addEventListener("click",e=>{if(e.target===veil)closeSheet()});
const head=(icon,title,sub,pcOn)=>`<div class="sh-head"><div class="sh-ico">${icon}</div><div class="sh-t"><h2>${title}</h2><p>${pcOn?'<span class="dot" style="background:var(--pc)"></span>':""}${sub}</p></div><button class="x" data-act="close" aria-label="Close">×</button></div>`;

function openScore(i,k){
  const p=S.players[i],pc=COLORS[i],nm=esc(p.name);
  const clear=has(p,k)?`<div class="row"><button class="btn danger" data-act="clear">Clear this box</button></div>`:"";
  if(k==="bonus"){
    ctx={i,k,n:p.b};
    showSheet(head("100","Yahtzee bonus",nm+" · 100 points each",true)+
      `<p class="note">Rolled another Yahtzee after already scoring 50 in the Yahtzee box? Add one here.</p>
       <div class="stepper"><button class="stepbtn" data-act="dec" aria-label="Remove one">−</button><div class="big" id="bn">${p.b}</div><button class="stepbtn" data-act="inc" aria-label="Add one">+</button></div>
       <button class="btn primary wide" data-act="savebonus">Save</button>`,pc);
    return;
  }
  const up=UPPER.find(u=>u[0]===k),lo=LOWER.find(l=>l.k===k);
  ctx={i,k};
  if(up){
    const f=up[2];
    showSheet(head(die(f,34),up[1],nm,true)+
      `<p class="ask">How many dice show ${f}?</p><div class="tiles">`+
      [0,1,2,3,4,5].map(c=>`<button class="tile ${p.s[k]===c*f?"sel":""}" data-v="${c*f}"><b>${c*f}</b><small>${c} ${c===1?"die":"dice"}</small></button>`).join("")+
      `</div>`+clear,pc);
  } else if(lo.t==="fixed"){
    showSheet(head(lo.v,lo.n,nm+" · "+lo.h,true)+
      `<div class="tiles two"><button class="tile main" data-v="${lo.v}"><b>+${lo.v}</b><small>I made it</small></button><button class="tile ${p.s[k]===0?"sel":""}" data-v="0"><b>0</b><small>Scratch it</small></button></div>`+clear,pc);
  } else {
    kp={buf:p.s[k]!==undefined&&p.s[k]!==0?String(p.s[k]):""};
    showSheet(head("Σ",lo.n,nm+" · "+lo.h,true)+
      `<div class="disp" id="disp"></div>
       <div class="keys">`+
      ["1","2","3","4","5","6","7","8","9"].map(d=>`<button class="key" data-key="${d}">${d}</button>`).join("")+
      `<button class="key aux" data-key="back" aria-label="Delete">⌫</button><button class="key" data-key="0">0</button><button class="key ok" data-key="ok" aria-label="Save score">✓</button></div>
       <div class="row"><button class="btn" data-v="0">Scratch (0)</button></div>`+clear,pc);
    kpDisplay();
  }
}
function kpDisplay(){
  const d=$("disp");if(!d||!kp)return;
  d.textContent=kp.buf===""?"Add up all five dice":kp.buf;
  d.classList.toggle("ph",kp.buf==="");
}
function kpPress(key){
  if(!kp||!ctx)return;
  if(key==="back")kp.buf=kp.buf.slice(0,-1);
  else if(key==="ok"){if(kp.buf!=="")commit(ctx.i,ctx.k,parseInt(kp.buf,10));return}
  else{const nb=kp.buf==="0"?key:kp.buf+key;if(parseInt(nb,10)<=30)kp.buf=nb}
  kpDisplay();
}
sheet.addEventListener("click",e=>{
  const b=e.target.closest("[data-v],[data-act],[data-key]");if(!b||!ctx)return;
  if(b.dataset.key!==undefined)return kpPress(b.dataset.key);
  if(b.dataset.v!==undefined)return commit(ctx.i,ctx.k,+b.dataset.v);
  const a=b.dataset.act;
  if(a==="close")closeSheet();
  else if(a==="clear")commit(ctx.i,ctx.k,null);
  else if(a==="inc"||a==="dec"){ctx.n=Math.max(0,Math.min(9,ctx.n+(a==="inc"?1:-1)));$("bn").textContent=ctx.n}
  else if(a==="savebonus")commit(ctx.i,"bonus",ctx.n);
  else if(a==="confirm"){const f=ctx.fn;closeSheet();f()}
});
document.addEventListener("keydown",e=>{
  if(!veil.classList.contains("open"))return;
  if(e.key==="Escape"){closeSheet();return}
  if(kp){
    if(/^[0-9]$/.test(e.key)){kpPress(e.key);e.preventDefault()}
    else if(e.key==="Backspace"){kpPress("back");e.preventDefault()}
    else if(e.key==="Enter"){kpPress("ok");e.preventDefault()}
  }
});

/* confirm sheet + controls */
function confirmSheet(title,text,okLabel,fn){
  ctx={fn};
  showSheet(head("?",title,"",false)+`<p class="note">${text}</p>
    <div class="row"><button class="btn" data-act="close">Keep playing</button><button class="btn danger" data-act="confirm">${okLabel}</button></div>`,"var(--red)");
}
function newGame(){
  hideToast();
  S=fresh(S.players.length,S.players.map(p=>p.name));save();render();window.scrollTo({top:0});
}
$$(".js-reset").forEach(b=>b.onclick=()=>confirmSheet("Start a new game?","This clears every score and the undo history. Player names stay.","New game",newGame));
$$(".js-plus").forEach(b=>b.onclick=()=>{
  if(S.players.length>=8)return;
  S.players.push({name:DEFNAMES[S.players.length],s:{},b:0});save();render();
});
$$(".js-minus").forEach(b=>b.onclick=()=>{
  if(S.players.length<=1)return;
  const last=S.players[S.players.length-1];
  const doIt=()=>{S.players.pop();if(S.turn>=S.players.length)S.turn=0;S.hist=S.hist.filter(e=>e.i<S.players.length);save();render()};
  if(Object.keys(last.s).length||last.b)confirmSheet("Remove "+esc(last.name)+"?","Their scores will be deleted.","Remove",doIt);
  else doIt();
});
$("theme").onclick=()=>{
  const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  r.dataset.theme=dark?"light":"dark";
};
render();
</script>
</body>
</html>
